name: Package Windows import app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RBXPORT_TEST: '1'
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure vendored OpenSSL
        shell: pwsh
        run: |
          'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' | Out-File $env:GITHUB_ENV -Append
          'C:\Strawberry\perl\bin' | Out-File $env:GITHUB_PATH -Append
      - run: cargo build -p rbxport --release
      - uses: actions/upload-artifact@v4
        with:
          name: rbxport-windows-import
          path: target/release/rbxport.exe
