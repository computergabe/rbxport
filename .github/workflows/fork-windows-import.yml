name: Fork Windows import build
on:
  push:
    branches: [feat/windows-import-command]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RBXPORT_TEST: '1'
      CARGO_TARGET_DIR: C:/rbx-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> C:/rbx-target'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure vendored OpenSSL
        shell: pwsh
        run: |
          'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' | Out-File $env:GITHUB_ENV -Append
          'C:\Strawberry\perl\bin' | Out-File $env:GITHUB_PATH -Append
      - run: cargo test -p rbxport --lib import_cli
      - run: cargo test -p rbxport --test commands import
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p rbxport --release
      - uses: actions/upload-artifact@v4
        with:
          name: rbxport-windows-import
          path: C:/rbx-target/release/rbxport.exe
